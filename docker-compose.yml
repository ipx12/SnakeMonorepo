services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: snake-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/sqlite.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-snake_super_secret_key_change_in_production_123}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - sqlite_data:/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: snake-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_API_URL=http://api:3001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      - api

volumes:
  sqlite_data:
    name: snake_sqlite_data
